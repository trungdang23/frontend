<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Default profile avatar</title>
  <desc id="desc">A neutral profile silhouette on a soft blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="36" x2="204" y1="20" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d7e5f5"/>
      <stop offset="1" stop-color="#aebfd3"/>
    </linearGradient>
    <linearGradient id="person" x1="72" x2="168" y1="55" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#e3ebf5"/>
    </linearGradient>
    <filter id="shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#486176" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="38" fill="url(#bg)"/>
  <circle cx="120" cy="88" r="45" fill="url(#person)" filter="url(#shadow)"/>
  <path
    d="M48 209c7-45 36-72 72-72s65 27 72 72c-20 13-44 21-72 21s-52-8-72-21Z"
    fill="url(#person)"
    filter="url(#shadow)"
  />
  <path
    d="M58 200c11-33 35-51 62-51s51 18 62 51"
    fill="none"
    stroke="#c4d2e2"
    stroke-linecap="round"
    stroke-width="5"
    opacity="0.8"
  />
</svg>
