name: frontend-ci

on:
  pull_request:
  push:

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://example.test/api/v1
      VITE_APP_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: pnpm build
