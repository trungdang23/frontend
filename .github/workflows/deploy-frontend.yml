name: deploy-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: frontend-production
  cancel-in-progress: false

env:
  DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
      VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Validate build variables
        run: |
          test -n "${VITE_API_BASE_URL}"
          test -n "${VITE_APP_ENV}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: pnpm build

  deploy-frontend:
    needs: verify-frontend
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Validate deploy configuration
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_HOST: ${{ vars.RUNTIME_APP_HOST }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
          RUNTIME_VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          test -n "${DEPLOY_PATH}"
          test -n "${RUNTIME_ENV_PATH}"
          test -n "${SERVICE_RESTART_COMMAND}"
          test -n "${RUNTIME_APP_NAME}"
          test -n "${RUNTIME_APP_HOST}"
          test -n "${RUNTIME_APP_PORT}"
          test -n "${RUNTIME_VITE_API_BASE_URL}"
          test -n "${RUNTIME_VITE_APP_ENV}"
          case "${RUNTIME_ENV_PATH}" in
            */.env|*/.env.*) ;;
            *)
              echo "RUNTIME_ENV_PATH must point to a file such as /path/to/.env.production." >&2
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_VERIFY_URL}" ]; then
            case "${DEPLOY_VERIFY_URL}" in
              http://*|https://*) ;;
              *)
                echo "DEPLOY_VERIFY_URL must start with http:// or https://." >&2
                exit 1
                ;;
            esac
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Sync repository to deploy path
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            echo "rsync is required on the self-hosted runner." >&2
            exit 1
          fi
          install -m 755 -d "$(dirname "${DEPLOY_PATH}")"
          install -m 755 -d "${DEPLOY_PATH}"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.env.production' \
            "${GITHUB_WORKSPACE}/" "${DEPLOY_PATH}/"

      - name: Render runtime env file from GitHub configuration
        env:
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_HOST: ${{ vars.RUNTIME_APP_HOST }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
          RUNTIME_VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
        run: |
          {
            printf 'NODE_ENV=production\n'
            printf 'APP_NAME=%s\n' "${RUNTIME_APP_NAME}"
            printf 'APP_HOST=%s\n' "${RUNTIME_APP_HOST}"
            printf 'APP_PORT=%s\n' "${RUNTIME_APP_PORT}"
            printf 'VITE_API_BASE_URL=%s\n' "${RUNTIME_VITE_API_BASE_URL}"
            printf 'VITE_APP_ENV=%s\n' "${RUNTIME_VITE_APP_ENV}"
          } > .deploy-runtime.env
          chmod 600 .deploy-runtime.env

      - name: Write runtime env file on deploy machine
        env:
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
        run: |
          runtime_env_dir="$(dirname "${RUNTIME_ENV_PATH}")"
          install -m 700 -d "${runtime_env_dir}"
          if [ -d "${RUNTIME_ENV_PATH}" ]; then
            echo "RUNTIME_ENV_PATH points to a directory, expected a file path." >&2
            exit 1
          fi
          install -m 600 .deploy-runtime.env "${RUNTIME_ENV_PATH}"

      - name: Deploy on target machine
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
        run: |
          service_restart_command="$(printf '%s' "${SERVICE_RESTART_COMMAND}" | perl -0pe 's/\r//g; s/^\s+//; s/\s+\z//')"
          if [ -z "${service_restart_command}" ]; then
            echo "SERVICE_RESTART_COMMAND is empty after sanitization." >&2
            exit 1
          fi
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          pnpm install --frozen-lockfile
          set -a
          . "${RUNTIME_ENV_PATH}"
          set +a
          pnpm build
          ${service_restart_command}

      - name: Post-deploy verification
        if: ${{ vars.DEPLOY_VERIFY_URL != '' }}
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          curl -fsSLI "${DEPLOY_VERIFY_URL}"

  verify-runtime-frontend:
    needs: deploy-frontend
    runs-on:
      - self-hosted
      - Linux
      - X64
    environment: production
    env:
      RUNTIME_APP_HOST: ${{ vars.RUNTIME_APP_HOST }}
      RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
    steps:
      - name: Wait for runtime to settle after deploy job completes
        run: |
          sleep 20

      - name: Delayed local runtime verification
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused --head "http://${RUNTIME_APP_HOST}:${RUNTIME_APP_PORT}/health"
