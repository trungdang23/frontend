name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: frontend-preview
  cancel-in-progress: false

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
      VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate build variables
        run: |
          test -n "${VITE_API_BASE_URL}"
          test -n "${VITE_APP_ENV}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: pnpm build

      - name: Package static artifact
        run: tar -czf frontend-dist.tgz -C dist .

      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tgz
          if-no-files-found: error
          retention-days: 7

  deploy-frontend:
    needs: verify-frontend
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Download static artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Validate deploy secrets and variables
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          PUBLISH_PATH: ${{ vars.PUBLISH_PATH }}
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          test -n "${CLOUDFLARE_ACCESS_CLIENT_ID}"
          test -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${PUBLISH_PATH}"
          case "${PUBLISH_PATH}" in
            /*) ;;
            *)
              echo "PUBLISH_PATH must be an absolute path on the target machine." >&2
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_VERIFY_URL}" ]; then
            case "${DEPLOY_VERIFY_URL}" in
              http://*|https://*) ;;
              *)
                echo "DEPLOY_VERIFY_URL must start with http:// or https://." >&2
                exit 1
                ;;
            esac
          fi
          if [ -z "${SSH_PORT}" ]; then
            echo "SSH_PORT is not set. Falling back to port 22."
          fi

      - name: Install cloudflared client
        env:
          CLOUDFLARED_VERSION: 2026.3.0
        run: |
          install -m 755 -d "${HOME}/bin"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o "${HOME}/bin/cloudflared"
          chmod 755 "${HOME}/bin/cloudflared"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/cloudflared" --version

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          private_key_source="$(mktemp)"
          decoded_key="$(mktemp)"
          printf '%s' "${SSH_PRIVATE_KEY}" > "${private_key_source}"
          perl -0pi -e 's/^\s*```(?:\w+)?\r?\n//; s/\r?\n```\s*$//; s/\A"(.*)"\z/$1/s; s/\A\x27(.*)\x27\z/$1/s; s/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g; s/[ \t]+$//mg' "${private_key_source}"
          if ssh-keygen -y -f "${private_key_source}" >/dev/null 2>&1; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif grep -q 'BEGIN '"OPENSSH"' PRIVATE KEY' "${private_key_source}"; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif tr -d '\r\n\t ' < "${private_key_source}" | base64 --decode --ignore-garbage > "${decoded_key}" 2>/dev/null \
            && ssh-keygen -y -f "${decoded_key}" >/dev/null 2>&1; then
            cp "${decoded_key}" ~/.ssh/id_ed25519
          else
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a valid base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          printf '%s' "${SSH_KNOWN_HOSTS}" \
            | perl -0pe 's/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g' \
            > ~/.ssh/known_hosts
          ssh_port="${SSH_PORT:-22}"
          cat > ~/.ssh/config <<EOF
          Host ${SSH_HOST}
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${ssh_port}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ProxyCommand ${HOME}/bin/cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config
          rm -f "${private_key_source}" "${decoded_key}"

      - name: Upload static artifact to target machine
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          PUBLISH_PATH: ${{ vars.PUBLISH_PATH }}
        run: |
          publish_parent="$(dirname "${PUBLISH_PATH}")"
          publish_tmp="${PUBLISH_PATH}.next"
          publish_backup="${PUBLISH_PATH}.previous"
          archive_tmp="${PUBLISH_PATH}.tgz"
          ssh "${SSH_HOST}" "install -m 755 -d '${publish_parent}' && rm -rf '${publish_tmp}' '${publish_backup}' && install -m 755 -d '${publish_tmp}'"
          scp frontend-dist.tgz "${SSH_HOST}:${archive_tmp}"
          ssh "${SSH_HOST}" \
            "set -euo pipefail && \
            tar -xzf '${archive_tmp}' -C '${publish_tmp}' && \
            rm -f '${archive_tmp}' && \
            if [ -d '${PUBLISH_PATH}' ]; then mv '${PUBLISH_PATH}' '${publish_backup}'; fi && \
            mv '${publish_tmp}' '${PUBLISH_PATH}' && \
            rm -rf '${publish_backup}'"

      - name: Post-deploy verification
        if: ${{ vars.DEPLOY_VERIFY_URL != '' }}
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          curl -fsSLI "${DEPLOY_VERIFY_URL}"
