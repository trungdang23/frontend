name: deploy-frontend

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  verify-frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
      VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate build variables
        run: |
          test -n "${VITE_API_BASE_URL}"
          test -n "${VITE_APP_ENV}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: pnpm build

  deploy-frontend:
    needs: verify-frontend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Validate deploy secrets and variables
        env:
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_HOST: ${{ vars.RUNTIME_APP_HOST }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
          RUNTIME_VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          test -n "${CLOUDFLARE_ACCESS_CLIENT_ID}"
          test -n "${CLOUDFLARE_ACCESS_CLIENT_SECRET}"
          test -n "${SSH_HOST}"
          test -n "${SSH_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${DEPLOY_PATH}"
          test -n "${RUNTIME_ENV_PATH}"
          test -n "${SERVICE_RESTART_COMMAND}"
          test -n "${RUNTIME_APP_NAME}"
          test -n "${RUNTIME_APP_HOST}"
          test -n "${RUNTIME_APP_PORT}"
          test -n "${RUNTIME_VITE_API_BASE_URL}"
          test -n "${RUNTIME_VITE_APP_ENV}"
          case "${RUNTIME_ENV_PATH}" in
            */.env|*/.env.*) ;;
            *)
              echo "RUNTIME_ENV_PATH must point to a file such as /path/to/.env.production." >&2
              exit 1
              ;;
          esac
          if [ -n "${DEPLOY_VERIFY_URL}" ]; then
            case "${DEPLOY_VERIFY_URL}" in
              http://*|https://*) ;;
              *)
                echo "DEPLOY_VERIFY_URL must start with http:// or https://." >&2
                exit 1
                ;;
            esac
          fi
          if [ -z "${SSH_PORT}" ]; then
            echo "SSH_PORT is not set. Falling back to port 22."
          fi

      - name: Install cloudflared client
        env:
          CLOUDFLARED_VERSION: 2026.3.0
        run: |
          install -m 755 -d "${HOME}/bin"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
            -o "${HOME}/bin/cloudflared"
          chmod 755 "${HOME}/bin/cloudflared"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"
          "${HOME}/bin/cloudflared" --version

      - name: Configure SSH
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          private_key_source="$(mktemp)"
          decoded_key="$(mktemp)"
          printf '%s' "${SSH_PRIVATE_KEY}" > "${private_key_source}"
          perl -0pi -e 's/^\s*```(?:\w+)?\r?\n//; s/\r?\n```\s*$//; s/\A"(.*)"\z/$1/s; s/\A\x27(.*)\x27\z/$1/s; s/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g; s/[ \t]+$//mg' "${private_key_source}"
          if ssh-keygen -y -f "${private_key_source}" >/dev/null 2>&1; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif grep -q 'BEGIN '"OPENSSH"' PRIVATE KEY' "${private_key_source}"; then
            cp "${private_key_source}" ~/.ssh/id_ed25519
          elif tr -d '\r\n\t ' < "${private_key_source}" | base64 --decode --ignore-garbage > "${decoded_key}" 2>/dev/null \
            && ssh-keygen -y -f "${decoded_key}" >/dev/null 2>&1; then
            cp "${decoded_key}" ~/.ssh/id_ed25519
          else
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a valid base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "SSH_PRIVATE_KEY is malformed. Paste the exact private key contents or a base64-encoded version into GitHub Secrets." >&2
            exit 1
          fi
          printf '%s' "${SSH_KNOWN_HOSTS}" \
            | perl -0pe 's/\r\n/\n/g; s/\r/\n/g; s/\\n/\n/g' \
            > ~/.ssh/known_hosts
          ssh_port="${SSH_PORT:-22}"
          cat > ~/.ssh/config <<EOF
          Host ${SSH_HOST}
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${ssh_port}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ProxyCommand ${HOME}/bin/cloudflared access ssh --hostname %h --service-token-id ${TUNNEL_SERVICE_TOKEN_ID} --service-token-secret ${TUNNEL_SERVICE_TOKEN_SECRET}
          EOF
          chmod 600 ~/.ssh/config
          rm -f "${private_key_source}" "${decoded_key}"

      - name: Render runtime env file from GitHub configuration
        env:
          RUNTIME_APP_NAME: ${{ vars.RUNTIME_APP_NAME }}
          RUNTIME_APP_HOST: ${{ vars.RUNTIME_APP_HOST }}
          RUNTIME_APP_PORT: ${{ vars.RUNTIME_APP_PORT }}
          RUNTIME_VITE_API_BASE_URL: ${{ vars.RUNTIME_VITE_API_BASE_URL }}
          RUNTIME_VITE_APP_ENV: ${{ vars.RUNTIME_VITE_APP_ENV }}
        run: |
          {
            printf 'NODE_ENV=production\n'
            printf 'APP_NAME=%s\n' "${RUNTIME_APP_NAME}"
            printf 'APP_HOST=%s\n' "${RUNTIME_APP_HOST}"
            printf 'APP_PORT=%s\n' "${RUNTIME_APP_PORT}"
            printf 'VITE_API_BASE_URL=%s\n' "${RUNTIME_VITE_API_BASE_URL}"
            printf 'VITE_APP_ENV=%s\n' "${RUNTIME_VITE_APP_ENV}"
          } > .deploy-runtime.env
          chmod 600 .deploy-runtime.env

      - name: Upload runtime env file
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
        run: |
          runtime_env_dir="$(dirname "${RUNTIME_ENV_PATH}")"
          runtime_env_tmp="${RUNTIME_ENV_PATH}.tmp"
          ssh "${SSH_HOST}" "install -m 700 -d '${runtime_env_dir}' && if [ -d '${RUNTIME_ENV_PATH}' ]; then echo 'RUNTIME_ENV_PATH points to a directory, expected a file path.' >&2; exit 1; fi"
          scp .deploy-runtime.env "${SSH_HOST}:${runtime_env_tmp}"
          ssh "${SSH_HOST}" "mv '${runtime_env_tmp}' '${RUNTIME_ENV_PATH}' && chmod 600 '${RUNTIME_ENV_PATH}'"

      - name: Deploy on target machine
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RUNTIME_ENV_PATH: ${{ vars.RUNTIME_ENV_PATH }}
          SERVICE_RESTART_COMMAND: ${{ vars.SERVICE_RESTART_COMMAND }}
          DEPLOY_REF: ${{ inputs.ref }}
          REPOSITORY_CLONE_URL: git@github.com:${{ github.repository }}.git
        run: |
          service_restart_command="$(printf '%s' "${SERVICE_RESTART_COMMAND}" | perl -0pe 's/\r//g; s/^\s+//; s/\s+\z//')"
          if [ -z "${service_restart_command}" ]; then
            echo "SERVICE_RESTART_COMMAND is empty after sanitization." >&2
            exit 1
          fi
          ssh "${SSH_HOST}" \
            "set -euo pipefail && \
            export NVM_DIR=\"\$HOME/.nvm\" && \
            test -s \"\$NVM_DIR/nvm.sh\" && \
            . \"\$NVM_DIR/nvm.sh\" && \
            (nvm use 20.20.2 >/dev/null || nvm use default >/dev/null) && \
            install -m 755 -d \"\$(dirname '${DEPLOY_PATH}')\" && \
            install -m 755 -d '${DEPLOY_PATH}' && \
            if [ ! -d '${DEPLOY_PATH}/.git' ]; then \
              git -C '${DEPLOY_PATH}' init && \
              git -C '${DEPLOY_PATH}' remote add origin '${REPOSITORY_CLONE_URL}' || true; \
            fi && \
            git -C '${DEPLOY_PATH}' remote set-url origin '${REPOSITORY_CLONE_URL}' && \
            if [ ! -d '${DEPLOY_PATH}/.git/refs' ] || ! git -C '${DEPLOY_PATH}' rev-parse --verify HEAD >/dev/null 2>&1; then \
              git -C '${DEPLOY_PATH}' fetch origin '${DEPLOY_REF}' && \
              git -C '${DEPLOY_PATH}' checkout -f -B '${DEPLOY_REF}' FETCH_HEAD; \
            fi && \
            cd '${DEPLOY_PATH}' && \
            git fetch --all --prune && \
            git checkout -f '${DEPLOY_REF}' && \
            git pull origin '${DEPLOY_REF}' && \
            pnpm install --frozen-lockfile && \
            set -a && \
            . '${RUNTIME_ENV_PATH}' && \
            set +a && \
            pnpm build && \
            ${service_restart_command}"

      - name: Post-deploy verification
        if: ${{ vars.DEPLOY_VERIFY_URL != '' }}
        env:
          DEPLOY_VERIFY_URL: ${{ vars.DEPLOY_VERIFY_URL }}
        run: |
          curl -fsSLI "${DEPLOY_VERIFY_URL}"
